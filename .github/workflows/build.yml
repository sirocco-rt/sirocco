name: "Sirocco: continuous integration tests"
on:
  push:
    branches:
      - "dev"
      - "main"
  pull_request:
    branches:
      - "dev"
      - "main"
env:
  SIROCCO: ${{ github.workspace }}
jobs:
  build_and_test:
    name: Build Sirocco and run tests
    runs-on: ubuntu-latest
    needs: greeting
    steps:
    - uses: actions/checkout@v4
    #- name: "Installing build dependencies"
    #  run: sudo apt update && apt install -y build-essential cmake

    - name: Installing MPI
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq openmpi-bin libopenmpi-dev

    - name: Configuring Sirocco
      run: ./configure

    - name: Cache GSL and CUnit
      id: libcache
      uses: actions/cache@v4
      with:
        path: |
          lib
          include/gsl
          include/CUnit
        key: libs-${{ runner.os }}-${{ hashFiles('Makefile.in') }}-gsl-2.6-cunit-3.2.7

    - name: Build libraries and Sirocco (cache miss)
      if: steps.libcache.outputs.cache-hit != 'true'
      run: make gh_workflow_install # this looks for mpicc and also builds GSL and CUnit

    - name: Build Sirocco source only (cache hit)
      if: steps.libcache.outputs.cache-hit == 'true'
      run: |
        cd $SIROCCO/source
        make CC=mpicc INDENT=no all

    - uses: actions/setup-python@v5
      with:
        python-version: '3.x' # Version range
    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wheel
        cd $SIROCCO/examples/gh-workflow/
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Checking Sirocco compiled and can read in inputs correctly
      run: |
        cd $SIROCCO/examples/gh-workflow/
        $SIROCCO/bin/Setup_Sirocco_Dir
        $SIROCCO/bin/sirocco -i cv_macro_benchmark
        $SIROCCO/bin/sirocco -i cv_standard
        $SIROCCO/bin/sirocco -i fiducial_agn
        $SIROCCO/bin/sirocco -i 1d_sn
        $SIROCCO/bin/sirocco -i -d sv_detailedmode
        $SIROCCO/bin/sirocco -i agn_ss_2010_modela
        $SIROCCO/bin/sirocco -i XRB_standard.pf
        $SIROCCO/bin/sirocco -i ngc5548
        $SIROCCO/bin/sirocco -i lamp_post
        $SIROCCO/bin/sirocco -i cv_standard_import

    - name: Running unit tests
      run: |
        cd $SIROCCO/source/tests
        make check CC=mpicc

    - name: Running Balmer test case
      run: |
        cd $SIROCCO/examples/gh-workflow/
        $SIROCCO/bin/sirocco -f -v 1 balmer_test
        python $SIROCCO/py_progs/balmer_decrement.py balmer_test

    - name: Running MPI macro-atom model with and without shared memory
      run: |
        cd $SIROCCO/examples/gh-workflow/
        # A short version of the regression model: 2 ionization cycles, 1 spectral cycle, fewer photons
        sed -e 's/^Photons_per_cycle .*/Photons_per_cycle 100000/' \
            -e 's/^Ionization_cycles .*/Ionization_cycles 2/' \
            -e 's/^Spectrum_cycles .*/Spectrum_cycles 1/' \
            $SIROCCO/examples/regress/agn_macro_matrix.pf > mpi_check_shm.pf

        # we run the same model with and without shared memory, and repeat the shared run
        # this is (try to) to catch races that are intermittent
        cp mpi_check_shm.pf mpi_check_noshm.pf
        cp mpi_check_shm.pf mpi_check_shm2.pf

        # run models and print out some progress info
        mpirun --oversubscribe -n 4 $SIROCCO/bin/sirocco mpi_check_shm > run_shm.txt
        tail -n 10 run_shm.txt
        echo "  run_shm.txt: done"
        mpirun --oversubscribe -n 4 $SIROCCO/bin/sirocco -no-shared-memory mpi_check_noshm > run_noshm.txt
        tail -n 10 run_noshm.txt
        echo "  run_noshm.txt: done"
        mpirun --oversubscribe -n 4 $SIROCCO/bin/sirocco mpi_check_shm2 > run_shm2.txt
        tail -n 10 run_shm2.txt
        echo "  run_shm2.txt: done"

    - name: Run windsave2table on MPI runs
      run: |
        cd $SIROCCO/examples/gh-workflow/
        $SIROCCO/bin/windsave2table mpi_check_shm
        $SIROCCO/bin/windsave2table mpi_check_noshm
        $SIROCCO/bin/windsave2table mpi_check_shm2

    - name: Checking the MPI runs are bitwise identical
      run: |
        cd $SIROCCO/examples/gh-workflow/
        python $SIROCCO/py_progs/compare_runs.py mpi_check_shm mpi_check_noshm
        python $SIROCCO/py_progs/compare_runs.py mpi_check_shm mpi_check_shm2

    - name: Checking Sirocco still compiles without MPI
      run: |
        cd $SIROCCO/source
        make clean
        make CC=gcc INDENT=no sirocco

    
