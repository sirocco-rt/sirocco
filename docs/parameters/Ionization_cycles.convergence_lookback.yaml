name: Ionization_cycles.convergence_lookback
description: |
  The number of consecutive cycles over which the convergence fraction must
  be stable (average absolute change < 2%) before early stopping triggers.
  Larger values are more conservative. Only used when
  Ionization_cycles.convergence_fraction > 0.
type: Integer
values: 2 to 100
default: 5
file: setup.c